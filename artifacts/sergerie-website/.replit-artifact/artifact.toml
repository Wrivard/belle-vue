kind = "web"
previewPath = "/"
title = "Les Rénovations Sergerie"
version = "1.0.0"
id = "artifacts/sergerie-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25729

[services.development]
run = "pnpm --filter @workspace/sergerie-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sergerie-website", "run", "build" ]
publicDir = "artifacts/sergerie-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25729"
BASE_PATH = "/"
